<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta "viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes AI 智能多模态助手 (黄金比例+同图连生版)</title>
    <!-- 引入 Tailwind CSS & Typography 插件 -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- 引入 Marked 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose pre {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            padding: 1rem !important;
            border-radius: 0.5rem !important;
            overflow-x: auto;
        }
        .prose code {
            color: #ef4444;
            font-weight: 500;
        }
        .prose pre code {
            color: #f8fafc !important;
            background-color: transparent !important;
            padding: 0 !important;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex overflow-hidden">

    <!-- 移动端顶部导航 (小屏) -->
    <div class="lg:hidden fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 z-20">
        <button onclick="toggleSidebar(true)" class="p-2 hover:bg-gray-100 rounded-lg">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 id="mobileTitle" class="text-sm font-semibold truncate max-w-[120px]">当前对话</h1>
        <select id="mobileModelSelect" onchange="changeModel(this.value)" class="text-xs border border-gray-200 rounded px-1.5 py-1 bg-white">
            <option value="agnes-2.0-flash">💬 文本对话</option>
            <option value="agnes-image-2.1-flash">🎨 图片生成</option>
            <option value="agnes-video-v2.0">🎬 视频生成</option>
        </select>
    </div>

    <!-- 侧边栏 -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-64 bg-gray-950 text-gray-200 flex flex-col z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 border-r border-gray-800">
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-gray-900 hover:bg-gray-800 border border-gray-800 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新建对话
            </button>
            <button onclick="toggleSidebar(false)" class="lg:hidden ml-2 p-2 hover:bg-gray-800 rounded-lg">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- 历史会话列表 -->
        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chatListContainer"></div>

        <!-- 高级图像配置参数面板 -->
        <div id="imageSettingsPanel" class="hidden p-4 border-t border-gray-800 bg-gray-900/40 space-y-3">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">图像生成参数</h3>
            
            <!-- 画面比例 -->
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">画面比例 (Aspect Ratio)</label>
                <select id="aspectRatioSelect" class="w-full bg-gray-950 border border-gray-800 text-gray-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-blue-500">
                    <option value="1024x1024">1:1 正方形 (1024x1024)</option>
                    <option value="768x1344">9:16 移动竖屏 (768x1344)</option>
                    <option value="1152x768">3:2 经典横画幅 (1152x768)</option>
                    <option value="768x1152">2:3 经典竖画幅 (768x1152)</option>
                    <option value="1024x768">4:3 标准横画幅 (1024x768)</option>
                    <option value="768x1024">3:4 标准竖画幅 (768x1024)</option>
                    <option value="1344x768">16:9 电影宽画幅 (1344x768)</option>
                </select>
            </div>

            <!-- 图生图参考图 URL & 本地上传组合 -->
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">参考图 (图生图可选)</label>
                <div class="flex gap-1.5">
                    <input type="text" id="refImageUrl" placeholder="粘贴网络图片 URL" 
                           class="flex-grow bg-gray-950 border border-gray-800 text-gray-200 rounded-l px-2 py-1.5 text-xs outline-none focus:border-blue-500 placeholder-gray-600 min-w-0">
                    
                    <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white px-2.5 py-1.5 rounded-r text-xs flex items-center justify-center flex-shrink-0 transition-colors">
                        <span>本地上传</span>
                        <input type="file" id="localImageInput" accept="image/*" class="hidden" onchange="handleLocalImageUpload(this)">
                    </label>
                </div>
                <span id="uploadStatus" class="text-[9px] text-gray-500 block mt-1 leading-normal">
                    已内置您专属的 ImgBB 加速通道。
                </span>
            </div>
        </div>

        <!-- 高级视频配置参数面板 -->
        <div id="videoSettingsPanel" class="hidden p-4 border-t border-gray-800 bg-gray-900/40 space-y-3">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">视频生成参数</h3>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">画面比例 (Aspect Ratio)</label>
                <select id="videoRatioSelect" class="w-full bg-gray-950 border border-gray-800 text-gray-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-blue-500">
                    <option value="16:9">16:9 电影宽屏 (横屏)</option>
                    <option value="9:16">9:16 移动竖屏 (抖音/TikTok)</option>
                    <option value="1:1">1:1 社交媒体 (正方形)</option>
                    <option value="4:3">4:3 传统屏幕比例</option>
                    <option value="3:2">3:2 相机视觉比例</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">清晰度与分辨率 (Resolution)</label>
                <select id="videoResolutionSelect" class="w-full bg-gray-950 border border-gray-800 text-gray-200 rounded px-2.5 py-1.5 text-xs outline-none focus:border-blue-500">
                    <option value="720p">720p HD (渲染极快/推荐)</option>
                    <option value="1080p">1080p Full HD (高精细节)</option>
                </select>
            </div>
        </div>

        <div class="p-4 border-t border-gray-800 space-y-2">
            <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-2 hover:bg-gray-900 rounded-lg transition-colors text-sm text-gray-300 hover:text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                接口配置与密钥
            </button>
        </div>
    </aside>

    <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black bg-opacity-50 z-20"></div>

    <!-- 右侧主对话区 -->
    <main class="flex-grow flex flex-col h-screen pt-14 lg:pt-0 relative bg-white">
        
        <!-- 顶部控制状态栏 -->
        <header class="hidden lg:flex h-14 border-b border-gray-100 items-center px-6 justify-between bg-white z-10">
            <span id="headerChatTitle" class="font-semibold text-gray-800 text-sm">新对话</span>
            
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 font-medium">当前模型：</span>
                <select id="headerModelSelect" onchange="changeModel(this.value)" class="text-xs font-semibold border border-gray-200 rounded-lg px-3 py-1.5 bg-slate-50 text-slate-700 outline-none cursor-pointer focus:ring-1 focus:ring-blue-500">
                    <option value="agnes-2.0-flash">💬 文本对话 (agnes-2.0-flash)</option>
                    <option value="agnes-image-2.1-flash">🎨 图片生成 (agnes-image-2.1-flash)</option>
                    <option value="agnes-video-v2.0">🎬 视频生成 (agnes-video-v2.0)</option>
                </select>
            </div>
        </header>

        <!-- 消息显示区 -->
        <div id="chatMessageArea" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 flex flex-col"></div>

        <!-- 底部输入栏 -->
        <div class="border-t border-gray-100 bg-white p-4">
            <div class="max-w-3xl mx-auto relative flex flex-col space-y-2">
                <div class="flex items-end gap-2 border border-gray-200 rounded-xl p-2 shadow-sm focus-within:ring-2 focus-within:ring-blue-500 bg-white">
                    <textarea id="promptInput" rows="1" oninput="autoResizeTextarea(this)" placeholder="输入提示词描述您想生成或聊天的内容..." 
                              class="flex-grow resize-none max-h-40 outline-none px-2 py-1.5 text-sm bg-transparent"
                              onkeydown="handleEnterKey(event)"></textarea>
                    <button id="sendBtn" onclick="handleSendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg transition-colors flex-shrink-0">
                        <svg class="w-4 h-4 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-semibold text-gray-800">API 参数配置</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">API Key (Agnes-AI)</label>
                    <input type="password" id="apiKey" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">API Base URL</label>
                    <input type="text" id="baseUrl" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <!-- ImgBB 配置栏 -->
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">ImgBB API Key (可选：图生图极速通道)</label>
                    <input type="password" id="imgbbKey" placeholder="无 Key 将默认采用公共 CDN 托管通道" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                    <p class="text-[10px] text-gray-400 mt-1">可在 <a href="https://imgbb.com/" target="_blank" class="text-blue-500 underline font-medium">imgbb.com</a> 免费获取 Key 以彻底防范公共线路拥堵。</p>
                </div>
            </div>

            <div class="flex justify-end gap-2 border-t pt-3">
                <button onclick="closeSettingsModal()" class="px-4 py-2 border border-gray-200 text-xs rounded-lg hover:bg-gray-50">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-700">保存修改</button>
            </div>
        </div>
    </div>

    <script>
        let conversations = JSON.parse(localStorage.getItem('agnes_multi_conversations')) || [];
        let activeId = localStorage.getItem('agnes_multi_active_id') || null;
        
        // 读取本地缓存设置，若无配置或 imgbbKey 为空，则自动写入并初始化您的专属 ImgBB 密钥
        let config = JSON.parse(localStorage.getItem('agnes_multi_config')) || {};
        if (!config.apiKey) config.apiKey = 'sk-7Hs6a8wx78gpfAJB6XNQKIipv5UO1Km6PgLsVBubAZSyPUjN';
        if (!config.baseUrl) config.baseUrl = 'https://apihub.agnes-ai.com/v1';
        if (!config.modelName) config.modelName = 'agnes-2.0-flash';
        
        // 智能重写机制：如果检测到没有配置 imgbbKey，则默认强制写入该专属 Key
        if (!config.imgbbKey) {
            config.imgbbKey = 'ee012301d6f72802294e6eed0d07ad47';
            localStorage.setItem('agnes_multi_config', JSON.stringify(config));
        }

        window.onload = function() {
            document.getElementById('apiKey').value = config.apiKey;
            document.getElementById('baseUrl').value = config.baseUrl;
            document.getElementById('imgbbKey').value = config.imgbbKey;
            document.getElementById('headerModelSelect').value = config.modelName;
            document.getElementById('mobileModelSelect').value = config.modelName;

            updateSidebarPanels(config.modelName);

            if (conversations.length === 0) {
                createNewChat();
            } else {
                if (!activeId || !conversations.some(c => c.id === activeId)) {
                    activeId = conversations[0].id;
                }
                saveAndRefresh();
            }
        };

        function changeModel(val) {
            config.modelName = val;
            localStorage.setItem('agnes_multi_config', JSON.stringify(config));
            document.getElementById('headerModelSelect').value = val;
            document.getElementById('mobileModelSelect').value = val;

            updateSidebarPanels(val);
        }

        function updateSidebarPanels(model) {
            const imgPanel = document.getElementById('imageSettingsPanel');
            const videoPanel = document.getElementById('videoSettingsPanel');
            
            if (model === 'agnes-image-2.1-flash') {
                imgPanel.classList.remove('hidden');
                videoPanel.classList.add('hidden');
            } else if (model === 'agnes-video-v2.0') {
                videoPanel.classList.remove('hidden');
                imgPanel.classList.add('hidden');
            } else {
                imgPanel.classList.add('hidden');
                videoPanel.classList.add('hidden');
            }
        }

        // 双通道图片上传逻辑
        async function handleLocalImageUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const statusSpan = document.getElementById('uploadStatus');
            const urlInput = document.getElementById('refImageUrl');
            
            statusSpan.innerText = "⏳ 正在上传图片，请稍候...";
            statusSpan.className = "text-[9px] text-blue-400 block mt-1 leading-normal";

            try {
                let directUrl = '';
                if (config.imgbbKey) {
                    statusSpan.innerText = "⏳ 正在通过您的 ImgBB 专属通道上传...";
                    directUrl = await uploadToImgBB(file, config.imgbbKey);
                } else {
                    statusSpan.innerText = "⏳ 正在通过公共加速通道 (Telegraph) 上传...";
                    directUrl = await uploadToTelegraph(file);
                }

                urlInput.value = directUrl;
                statusSpan.innerText = "✅ 临时公网直链已生成，已自动填入输入框！";
                statusSpan.className = "text-[9px] text-green-500 block mt-1 leading-normal";
            } catch (err) {
                console.error('图片上传失败:', err);
                statusSpan.innerText = `❌ 上传失败: ${err.message} (若公共通道连接不顺，建议配置专属 ImgBB API Key)`;
                statusSpan.className = "text-[9px] text-red-500 block mt-1 leading-normal";
            } finally {
                input.value = '';
            }
        }

        async function uploadToTelegraph(file) {
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch('https://telegra.ph/upload', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Telegraph 响应异常 (${response.status})`);
            }

            const data = await response.json();
            if (data && data[0] && data[0].src) {
                return 'https://telegra.ph' + data[0].src;
            }
            throw new Error('Telegraph 返回格式异常');
        }

        async function uploadToImgBB(file, apiKey) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`ImgBB 响应异常 (${response.status})`);
            }

            const data = await response.json();
            if (data && data.data && data.data.url) {
                return data.data.url;
            }
            throw new Error('ImgBB 返回格式异常');
        }

        function createNewChat() {
            const newId = 'chat_' + Date.now();
            conversations.unshift({
                id: newId,
                title: '新建对话',
                messages: []
            });
            activeId = newId;
            saveAndRefresh();
            toggleSidebar(false);
            document.getElementById('promptInput').focus();
        }

        function switchConversation(id) {
            activeId = id;
            saveAndRefresh();
            toggleSidebar(false);
        }

        function deleteConversation(e, id) {
            e.stopPropagation();
            if (confirm('确认删除当前对话吗？')) {
                conversations = conversations.filter(c => c.id !== id);
                if (activeId === id) {
                    activeId = conversations.length > 0 ? conversations[0].id : null;
                }
                if (conversations.length === 0) createNewChat();
                else saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('agnes_multi_conversations', JSON.stringify(conversations));
            localStorage.setItem('agnes_multi_active_id', activeId);
            renderSidebarList();
            renderActiveMessages();
        }

        function renderSidebarList() {
            const container = document.getElementById('chatListContainer');
            container.innerHTML = '';
            conversations.forEach(chat => {
                const isActive = chat.id === activeId;
                const activeClasses = isActive ? 'bg-gray-900 border-gray-800 text-white' : 'hover:bg-gray-900/50 border-transparent text-gray-400 hover:text-gray-200';
                
                const item = document.createElement('div');
                item.className = `flex items-center justify-between group p-2.5 rounded-lg border text-sm cursor-pointer transition-all ${activeClasses}`;
                item.onclick = () => switchConversation(chat.id);
                item.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span class="truncate pr-2 font-medium">${chat.title}</span>
                    </div>
                    <button onclick="deleteConversation(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-gray-800 rounded text-gray-500 hover:text-red-400 transition-opacity">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function renderActiveMessages() {
            const activeChat = conversations.find(c => c.id === activeId);
            const container = document.getElementById('chatMessageArea');
            container.innerHTML = '';

            if (!activeChat) return;

            document.getElementById('headerChatTitle').innerText = activeChat.title;
            document.getElementById('mobileTitle').innerText = activeChat.title;

            if (activeChat.messages.length === 0) {
                container.innerHTML = `
                    <div class="flex-grow flex flex-col justify-center items-center text-gray-400 space-y-2">
                        <p class="text-sm font-medium">请选择对应的模型，输入您的提示词发起创作</p>
                    </div>
                `;
                return;
            }

            activeChat.messages.forEach(msg => {
                appendMessageBubble(msg.role, msg.content, msg.type, msg.mediaUrl, false);
            });
            scrollToBottom();
        }

        function appendMessageBubble(role, content, type, mediaUrl, isPending) {
            const container = document.getElementById('chatMessageArea');
            const placeholder = container.querySelector('.flex-grow');
            if (placeholder) placeholder.remove();

            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;

            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = "bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 max-w-[85%] md:max-w-[75%] shadow-sm text-sm whitespace-pre-wrap leading-relaxed";
                bubble.innerText = content;
            } else {
                bubble.className = "bg-white border border-gray-100 rounded-2xl rounded-tl-none px-4 py-2.5 max-w-[85%] md:max-w-[75%] shadow-sm text-sm text-gray-800 leading-relaxed";
                
                if (isPending) {
                    bubble.id = "pending-bubble";
                    bubble.innerHTML = `<div class="flex items-center gap-2 text-gray-500">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                        <span>模型正在生成中，请耐心等候...</span>
                    </div>`;
                } else {
                    if (type === 'image' && mediaUrl) {
                        bubble.innerHTML = `<div class="space-y-2">
                            <img src="${mediaUrl}" alt="Generated Image" class="rounded-lg max-w-full h-auto shadow-sm max-h-[500px]">
                            <p class="text-xs text-gray-400 mt-1">Prompt: ${content}</p>
                        </div>`;
                    } else if (type === 'video' && mediaUrl) {
                        bubble.innerHTML = `<div class="space-y-2">
                            <video src="${mediaUrl}" controls class="rounded-lg max-w-full shadow-sm max-h-[500px]"></video>
                            <p class="text-xs text-gray-400 mt-1">Prompt: ${content}</p>
                        </div>`;
                    } else {
                        bubble.className += " prose prose-slate prose-sm";
                        bubble.innerHTML = marked.parse(content);
                    }
                }
            }

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        }

        async function handleSendMessage() {
            const input = document.getElementById('promptInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const activeChat = conversations.find(c => c.id === activeId);
            if (!activeChat) return;

            activeChat.messages.push({ role: 'user', content: prompt });
            if (activeChat.title === '新建对话') {
                activeChat.title = prompt.length > 12 ? prompt.slice(0, 12) + '...' : prompt;
            }

            input.value = '';
            input.style.height = 'auto';
            saveAndRefresh();

            toggleSendButtonState(true);
            appendMessageBubble('assistant', '', null, null, true);
            scrollToBottom();

            try {
                if (config.modelName === 'agnes-image-2.1-flash') {
                    await handleImageGeneration(prompt, activeChat);
                } else if (config.modelName === 'agnes-video-v2.0') {
                    await handleVideoGeneration(prompt, activeChat);
                } else {
                    await handleTextStreaming(activeChat);
                }
            } catch (err) {
                const pending = document.getElementById('pending-bubble');
                if (pending) {
                    pending.innerHTML = `<span class="text-red-500 font-medium">请求失败: ${err.message}</span>`;
                }
                toggleSendButtonState(false);
            }
        }

        // 文本模型流式处理
        async function handleTextStreaming(activeChat) {
            const response = await fetch(`${config.baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.modelName,
                    messages: activeChat.messages,
                    stream: true
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `状态码: ${response.status}`);
            }

            const pending = document.getElementById('pending-bubble');
            pending.id = "streaming-bubble";
            pending.className += " prose prose-slate prose-sm";
            pending.innerHTML = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = '';
            let fullText = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    const cleanedLine = line.trim();
                    if (!cleanedLine || cleanedLine === 'data: [DONE]') continue;
                    if (cleanedLine.startsWith('data: ')) {
                        try {
                            const parsed = JSON.parse(cleanedLine.slice(6));
                            const content = parsed.choices[0]?.delta?.content || '';
                            if (content) {
                                fullText += content;
                                pending.innerHTML = marked.parse(fullText);
                                scrollToBottom();
                            }
                        } catch (e) {}
                    }
                }
            }

            activeChat.messages.push({ role: 'assistant', content: fullText, type: 'text' });
            saveAndRefresh();
            toggleSendButtonState(false);
        }

        // 图像生成功能
        async function handleImageGeneration(prompt, activeChat) {
            const size = document.getElementById('aspectRatioSelect').value;
            const refImg = document.getElementById('refImageUrl').value.trim();

            const payload = {
                model: config.modelName,
                prompt: prompt,
                size: size
            };

            if (refImg) {
                payload.tags = ["img2img"];
                payload.extra_body = {
                    image: [ refImg ],
                    response_format: "url"
                };
            }

            const response = await fetch(`${config.baseUrl}/images/generations`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `图片生成失败，状态码: ${response.status}`);
            }

            const data = await response.json();
            const imageUrl = data.data[0]?.url;

            if (!imageUrl) throw new Error("接口未返回图片URL。");

            // 成功后：不清除 refImageUrl，以便用户持续进行同图连续生图
            // 仅重置提示文字，方便用户在页面上得到直观的保留反馈
            document.getElementById('uploadStatus').innerText = "✅ 链接已保留，可继续输入新提示词进行生成。";
            document.getElementById('uploadStatus').className = "text-[9px] text-green-500 block mt-1 leading-normal";

            activeChat.messages.push({ 
                role: 'assistant', 
                content: prompt + (refImg ? " (图生图模式)" : ` (比例: ${size})`), 
                type: 'image', 
                mediaUrl: imageUrl 
            });
            saveAndRefresh();
            toggleSendButtonState(false);
        }

        // 辅助函数：根据比例和清晰度计算视频物理像素
        function getVideoDimensions(ratio, resolution) {
            if (resolution === '1080p') {
                if (ratio === '16:9') return { width: 1920, height: 1080 };
                if (ratio === '9:16') return { width: 1080, height: 1920 };
                if (ratio === '1:1') return { width: 1080, height: 1080 };
                if (ratio === '4:3') return { width: 1440, height: 1080 };
                if (ratio === '3:2') return { width: 1620, height: 1080 };
            } else { // 720p 档位
                if (ratio === '16:9') return { width: 1280, height: 720 };
                if (ratio === '9:16') return { width: 720, height: 1280 };
                if (ratio === '1:1') return { width: 768, height: 768 };
                if (ratio === '4:3') return { width: 960, height: 720 };
                if (ratio === '3:2') return { width: 1080, height: 720 };
            }
            return { width: 1152, height: 768 };
        }

        // 视频生成
        async function handleVideoGeneration(prompt, activeChat) {
            const ratio = document.getElementById('videoRatioSelect').value;
            const resolution = document.getElementById('videoResolutionSelect').value;
            const { width, height } = getVideoDimensions(ratio, resolution);

            const response = await fetch(`${config.baseUrl}/videos`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.modelName,
                    prompt: prompt,
                    width: width,
                    height: height
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `任务创建失败，状态码: ${response.status}`);
            }

            const data = await response.json();
            const taskId = data.id || data.task_id;

            if (!taskId) throw new Error("未能获取到任务ID。");

            const pending = document.getElementById('pending-bubble');

            let pollInterval = setInterval(async () => {
                try {
                    const statusRes = await fetch(`${config.baseUrl}/videos/${taskId}`, {
                        headers: { 'Authorization': `Bearer ${config.apiKey}` }
                    });
                    
                    if (!statusRes.ok) throw new Error(`查询状态失败 (${statusRes.status})`);
                    const statusData = await statusRes.json();
                    
                    if (statusData.status === 'completed') {
                        clearInterval(pollInterval);
                        const videoUrl = statusData.remixed_from_video_id;
                        
                        activeChat.messages.push({
                            role: 'assistant',
                            content: prompt,
                            type: 'video',
                            mediaUrl: videoUrl
                        });
                        saveAndRefresh();
                        toggleSendButtonState(false);

                    } else if (statusData.status === 'failed') {
                        clearInterval(pollInterval);
                        pending.innerHTML = `<span class="text-red-500 font-medium">视频渲染失败: ${statusData.error || '渲染异常'}</span>`;
                        toggleSendButtonState(false);
                    } else {
                        const progress = statusData.progress !== undefined ? `${statusData.progress}%` : '排队中...';
                        pending.innerHTML = `<div class="flex items-center gap-2.5 text-slate-500">
                            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                            <span>正在生成视频中 (进度: ${progress})</span>
                        </div>`;
                    }
                } catch (e) {
                    clearInterval(pollInterval);
                    pending.innerHTML = `<span class="text-red-500 font-medium">轮询中断: ${e.message}</span>`;
                    toggleSendButtonState(false);
                }
            }, 4000);
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnterKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSendMessage();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessageArea');
            container.scrollTop = container.scrollHeight;
        }

        function toggleSendButtonState(disabled) {
            const btn = document.getElementById('sendBtn');
            const input = document.getElementById('promptInput');
            if (disabled) {
                btn.disabled = true;
                btn.classList.add('opacity-40');
                input.disabled = true;
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-40');
                input.disabled = false;
                input.focus();
            }
        }

        function toggleSidebar(show) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            config.apiKey = document.getElementById('apiKey').value.trim();
            config.baseUrl = document.getElementById('baseUrl').value.trim();
            config.imgbbKey = document.getElementById('imgbbKey').value.trim();
            localStorage.setItem('agnes_multi_config', JSON.stringify(config));
            closeSettingsModal();
            alert('配置已保存！');
        }
    </script>
