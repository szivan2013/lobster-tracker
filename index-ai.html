<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes AI 2.0 客户端</title>
    <!-- 引入 Tailwind CSS 构建干净的界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 导航栏 -->
    <header class="bg-white border-b border-gray-200 py-4 px-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900">Agnes AI 2.0 客户端</h1>
            <span class="text-sm text-gray-500">直连官方网关版 (已支持流式输出)</span>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 左侧配置面板 -->
        <section class="lg:col-span-1 bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">API 配置</h2>
            
            <!-- API Key -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">API Key</label>
                <input type="password" id="apiKey" value="sk-7Hs6a8wx78gpfAJB6XNQKIipv5UO1Km6PgLsVBubAZSyPUjN" placeholder="输入您的 API Key" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- Base URL -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">API Base URL</label>
                <input type="text" id="baseUrl" value="https://apihub.agnes-ai.com/v1" placeholder="例如: https://apihub.agnes-ai.com/v1" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <p class="text-xs text-gray-400 mt-1">已默认设置为官方可用网关</p>
            </div>

            <!-- 模型名称 -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">模型名称 (Model)</label>
                <input type="text" id="modelName" value="agnes-2.0-flash" placeholder="例如: agnes-2.0-flash" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- 输出模式 -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">输出模式</label>
                <div class="flex items-center space-x-2 mt-2">
                    <input type="checkbox" id="useStream" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="useStream" class="text-sm text-gray-700 font-medium select-none">启用流式输出 (Stream)</label>
                </div>
            </div>
        </section>

        <!-- 右侧交互区域 -->
        <section class="lg:col-span-3 flex flex-col space-y-4">
            
            <!-- 输入区域 -->
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
                <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">输入提示词 (Prompt)</h2>
                
                <textarea id="promptInput" rows="4" placeholder="请在这里输入您的提示词，例如：请写一首关于春天的诗。" 
                          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                
                <div class="flex justify-end">
                    <button id="submitBtn" onclick="handleSubmit()" 
                            class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors focus:outline-none">
                        发送请求
                    </button>
                </div>
            </div>

            <!-- 输出区域 -->
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex-grow flex flex-col min-h-[300px]">
                <h2 class="text-lg font-semibold text-gray-700 border-b pb-2 mb-4">生成结果</h2>
                
                <!-- Loading 动画 -->
                <div id="loading" class="hidden flex justify-center items-center py-4">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                    <span class="text-gray-500 text-sm ml-2">连接模型中...</span>
                </div>

                <!-- 结果展示框 -->
                <div id="outputContainer" class="flex-grow overflow-auto p-4 bg-gray-50 rounded-lg border border-gray-100 min-h-[200px]">
                    <div id="placeholderText" class="text-gray-400 text-center py-12">等待生成结果...</div>
                    <div id="textOutput" class="hidden whitespace-pre-wrap text-gray-700 leading-relaxed"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        已成功适配直接请求安全通道。
    </footer>

    <!-- 交互逻辑 JS -->
    <script>
        async function handleSubmit() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const modelName = document.getElementById('modelName').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const useStream = document.getElementById('useStream').checked;

            if (!apiKey) {
                alert('请先输入您的 API Key');
                return;
            }
            if (!prompt) {
                alert('请输入提示词');
                return;
            }

            showLoading(true);
            resetOutputs();

            try {
                if (useStream) {
                    await callTextAPIStream(baseUrl, apiKey, modelName, prompt);
                } else {
                    await callTextAPINonStream(baseUrl, apiKey, modelName, prompt);
                }
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        // 辅助函数：格式化请求接口地址
        function getRequestUrl(baseUrl) {
            let url = baseUrl;
            if (url.endsWith('/')) {
                url = url.slice(0, -1);
            }
            return `${url}/chat/completions`;
        }

        // 1. 流式调用 (Streaming Output)
        async function callTextAPIStream(baseUrl, apiKey, model, prompt) {
            const fetchUrl = getRequestUrl(baseUrl);
            
            const response = await fetch(fetchUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: 'user', content: prompt }],
                    stream: true
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `请求失败，目标URL: ${fetchUrl}，状态码: ${response.status}`);
            }

            const textOutput = document.getElementById('textOutput');
            textOutput.classList.remove('hidden');

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); 

                for (const line of lines) {
                    const cleanedLine = line.trim();
                    if (!cleanedLine) continue;
                    if (cleanedLine === 'data: [DONE]') continue;

                    if (cleanedLine.startsWith('data: ')) {
                        try {
                            const jsonStr = cleanedLine.slice(6);
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0]?.delta?.content || '';
                            if (content) {
                                textOutput.textContent += content;
                                const container = document.getElementById('outputContainer');
                                container.scrollTop = container.scrollHeight;
                            }
                        } catch (err) {
                            console.warn('解析当前流式分片失败:', cleanedLine, err);
                        }
                    }
                }
            }
        }

        // 2. 普通非流式调用 (作为备用)
        async function callTextAPINonStream(baseUrl, apiKey, model, prompt) {
            const fetchUrl = getRequestUrl(baseUrl);

            const response = await fetch(fetchUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: 'user', content: prompt }],
                    stream: false
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `请求失败，目标URL: ${fetchUrl}，状态码: ${response.status}`);
            }

            const data = await response.json();
            const content = data.choices[0]?.message?.content || '';
            
            const textOutput = document.getElementById('textOutput');
            textOutput.textContent = content;
            textOutput.classList.remove('hidden');
        }

        // 辅助 UI 控制函数
        function showLoading(isLoading) {
            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            if (isLoading) {
                loading.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50');
            } else {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        }

        function resetOutputs() {
            document.getElementById('placeholderText').classList.add('hidden');
            const textOutput = document.getElementById('textOutput');
            textOutput.classList.add('hidden');
            textOutput.classList.remove('text-red-600');
            textOutput.textContent = '';
        }

        function showError(message) {
            const textOutput = document.getElementById('textOutput');
            textOutput.textContent = `请求出错: ${message}`;
            textOutput.classList.remove('hidden');
            textOutput.classList.add('text-red-600');
        }
    </script>
</body>
</html>
